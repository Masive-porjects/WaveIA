# Brikmaster — stack local dockerizado.
#
#   docker compose up --build
#
#   studio     → http://localhost:3000
#   audiomind  → http://localhost:8000/health
#   simulator  → ws://localhost:8765  (mock del bridge: emite LiveParams)
#
# El bridge real (apps/bridge) NO se dockeriza: python-rtmidi necesita el
# stack MIDI del host (hardware/driver). Para Live Engine sin controlador
# MIDI se usa el simulator, igual que en e2e. Si tienes MIDI, corre el
# bridge en el host con scripts/start/start-bridge.bat (ocupa :8765 —
# comenta el servicio simulator para evitar el conflicto de puerto).

services:
  audiomind:
    build: ./apps/audiomind
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Sesiones/uploads sobreviven a `docker compose restart`. Las sesiones
      # en memoria NO: al reiniciar el contenedor el frontend avisa
      # "Tu sesión anterior expiró" (comportamiento ya documentado).
      - audiomind-uploads:/app/uploads
      - audiomind-outputs:/app/outputs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    ports:
      - "8765:8765"
    # Para otro escenario: docker compose run --service-ports simulator
    #   --mode server --scenario presets --host 0.0.0.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket;socket.create_connection(('localhost',8765),3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
      args:
        # El browser corre en el host: apunta al puerto publicado de audiomind.
        # NEXT_PUBLIC_* se inlinean en build — cambiarla exige rebuild.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      audiomind:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  audiomind-uploads:
  audiomind-outputs:
