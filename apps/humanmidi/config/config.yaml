# HumanMidi Configuration
# Todos los valores por defecto vienen de src/config/defaults.py
# Este archivo hace deep-merge sobre los defaults

midi:
  virtual_port_name: "HumanMidi"  # Nombre del puerto MIDI virtual (IAC en macOS, loopMIDI en Windows)
  # Notas: en macOS usar "IAC Driver HumanMidi", en Windows "loopMIDI HumanMidi"

camera:
  device_id: 0
  width: 640
  height: 480
  fps: 30

hand_detector:
  model_complexity: 1  # 0=lite, 1=full
  max_num_hands: 2
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.5

gestures:
  drums:
    enabled: true
    zones: 4
    notes: [36, 38, 42, 49]  # Kick, Snare, Closed HH, Open HH
    cooldown_frames: 10
    velocity_scale: 1.0
  piano:
    enabled: true
    finger_offsets: [0, 2, 4, 5, 7]  # Semitonos desde root (C mayor)
    octave_range: [2, 6]  # Octavas 2-6 segun altura de mano
    anti_stuck_notes: true
  cc_controller:
    enabled: true
    cc_left_thumb: 74   # Legacy: filtro
    cc_right_thumb: 92  # Legacy: reverb
    smoothing_alpha: 0.3
    dead_zone: 2
  studio:
    enabled: true
    # Modo studio: mapea gestos a LiveParams (para Bridge -> Live Engine)
    # CC fijos segun spec:
    # CC 74  = Pulgar derecho -> filter_cutoff (LOG: 200 * (12000/200)^(v/127))
    # CC 92  = Pulgar izquierdo -> reverb_mix (v/127)
    # CC 71  = Altura mano -> delay_time (50 + 750*(v/127))
    # CC 73  = Apertura mano -> echo_feedback (0.8 * v/127)
    # CC 16  = Posicion X -> drive (v/127)
    # Nota 36/38/42/49 = Palmadas zona 0-3 -> fx_preset (clean/dub/big_room/radio)
    smoothing_alpha: 0.3
    dead_zone: 2

ui:
  show_landmarks: true
  show_bbox: true
  show_zones: true
  show_fps: true
  show_cc_panels: true
  window_name: "HumanMidi"