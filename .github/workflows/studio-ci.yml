name: studio-ci

on:
  pull_request:
    paths:
      - "apps/studio/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [develop, main]
    paths:
      - "apps/studio/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run build
        env:
          # Placeholder — el build de Next.js no ejecuta convex, pero
          # necesita la env var presente para no fallar en tiempo de build.
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

  # Deploy real: requiere el secret CONVEX_DEPLOY_KEY (dashboard de Convex →
  # Settings → Deploy Key de producción). Se activa recién cuando exista.
  deploy-convex:
    if: github.ref == 'refs/heads/main' && vars.CONVEX_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
